# Run PostgreSQL, MySQL and SQL Server locally. Start: docker compose up -d
# Datasets: generate with `python3 gen_data.py all`; Postgres/MySQL load data/<dialect>/*.sql on first start.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: change_me_pg
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/docker-entrypoint-initdb.d"]
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root
      MYSQL_DATABASE: shop
      MYSQL_USER: analyst
      MYSQL_PASSWORD: change_me_my
    ports: ["3306:3306"]
    volumes: ["./data/mysql:/docker-entrypoint-initdb.d"]
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Change_me_1Strong"
    ports: ["1433:1433"]
